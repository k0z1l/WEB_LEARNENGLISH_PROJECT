        let currentLang = localStorage.getItem('appLang') || 'vi';

        function updateLanguage(lang) {
            // Chốt chặn phòng thủ dữ liệu rác hoặc undefined
            if (!lang || (lang !== 'vi' && lang !== 'en')) {
                lang = localStorage.getItem('appLang') || 'vi';
                if (lang !== 'vi' && lang !== 'en') lang = 'vi';
            }
            
            currentLang = lang;
            localStorage.setItem('appLang', lang);
            
            const langBtnText = document.getElementById('lang-text');
            if (langBtnText) {
                langBtnText.textContent = lang === 'vi' ? 'VN | EN' : 'EN | VN';
            }
            
            const elements = document.querySelectorAll('[data-i18n]');
            elements.forEach(el => {
                const key = el.getAttribute('data-i18n');
                if(translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });
            
            const placeholders = document.querySelectorAll('[data-i18n-placeholder]');
            placeholders.forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if(translations[lang][key]) {
                    el.setAttribute('placeholder', translations[lang][key]);
                }
            });

            // Trigger custom event so page-specific scripts can update if needed
            document.dispatchEvent(new CustomEvent('languageChanged', { detail: { lang: currentLang } }));
        }

        function toggleLanguage() {
            updateLanguage(currentLang === 'vi' ? 'en' : 'vi');
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateLanguage(currentLang);
        });

        function t(key) {
            return translations[currentLang][key] || key;
        }
    </script>
</body>
</html>
